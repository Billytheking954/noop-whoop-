name: Tools Python CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tools-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run WHOOP capture and decoder regressions
        working-directory: Tools/linux-capture
        run: |
          set -o pipefail
          python3 -m unittest discover -p "test_*.py" -v 2>&1 | tee "$RUNNER_TEMP/out.txt"
          ran=$(grep -oE '^Ran [0-9]+ test' "$RUNNER_TEMP/out.txt" | grep -oE '[0-9]+')
          echo "collected ${ran:-0} tests"
          if [ "${ran:-0}" -lt 200 ]; then
            echo "::error::expected at least 200 decoder/capture tests"
            exit 1
          fi
      - name: Run retained repository-tool tests
        working-directory: Tools
        run: |
          set -o pipefail
          python3 -m unittest -v \
            test_appchangelog_gen \
            test_backup_validation \
            test_prune_stale_branches \
            test_verify_iphone_ipa \
            2>&1 | tee "$RUNNER_TEMP/out.txt"
          ran=$(grep -oE '^Ran [0-9]+ test' "$RUNNER_TEMP/out.txt" | grep -oE '[0-9]+')
          echo "collected ${ran:-0} retained tool tests"
          if [ "${ran:-0}" -lt 20 ]; then
            echo "::error::expected at least 20 retained tool tests"
            exit 1
          fi

  windows-capture:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run WHOOP decoder tests with legacy Windows encodings
        working-directory: Tools/linux-capture
        env:
          PYTHONUTF8: '0'
          PYTHONIOENCODING: 'cp1252:strict'
          PYTHONLEGACYWINDOWSSTDIO: '1'
        shell: python
        run: |
          import sys
          import unittest
          suite = unittest.defaultTestLoader.discover('.', pattern='test_*.py')
          count = suite.countTestCases()
          print(f'collected {count} tests', flush=True)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if count < 200 or result.testsRun < 200:
              print('::error::expected at least 200 tests; discovery or execution is incomplete')
              sys.exit(1)
          sys.exit(0 if result.wasSuccessful() else 1)
