name: App build (iPhone)

on:
  pull_request:
    branches: [main]
    paths:
      - 'Strand/**'
      - 'StrandTests/**'
      - 'StrandiOS/**'
      - 'StrandiOSShared/**'
      - 'StrandiOSWidgets/**'
      - 'Packages/**'
      - 'Config/**'
      - 'project.yml'
      - '.github/workflows/app-build.yml'
  push:
    branches: [main]
    paths:
      - 'Strand/**'
      - 'StrandTests/**'
      - 'StrandiOS/**'
      - 'StrandiOSShared/**'
      - 'StrandiOSWidgets/**'
      - 'Packages/**'
      - 'Config/**'
      - 'project.yml'
      - '.github/workflows/app-build.yml'

concurrency:
  group: app-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iphone-build-and-tests:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate iPhone project
        run: xcodegen generate

      - name: Assert iPhone-only product graph
        shell: bash
        run: |
          set -euo pipefail
          test ! -d android
          test ! -d NOOPWatch
          test ! -d NOOPWatchComplications
          ! grep -q 'platform: macOS' project.yml
          ! grep -q 'platform: watchOS' project.yml
          ! grep -q 'TARGETED_DEVICE_FAMILY: "1,2"' project.yml
          grep -q 'TARGETED_DEVICE_FAMILY: "1"' project.yml
          xcodebuild -project Strand.xcodeproj -list

      - name: Build for iPhone Simulator
        run: >-
          xcodebuild
          -project Strand.xcodeproj
          -scheme NOOPiOS
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Run iPhone-hosted unit tests
        shell: bash
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in d.values() for x in runtime if x.get("isAvailable") and x.get("name","").startswith("iPhone")))')"
          echo "Using iPhone simulator $UDID"
          xcodebuild \
            -project Strand.xcodeproj \
            -scheme NOOPiOS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Capture seeded iPhone design review screens
        shell: bash
        run: |
          set -euo pipefail
          CAPTURE_DIR="$RUNNER_TEMP/noop-ui-review"
          mkdir -p "$CAPTURE_DIR"
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; phones=[x for runtime in d.values() for x in runtime if x.get("isAvailable") and x.get("name", "").startswith("iPhone")]; mini=next((x for x in phones if "mini" in x["name"].lower()), None); print((mini or phones[0])["udid"])')"
          # Hosted images may ship only a large iPhone. Create a mini when its device type is
          # installed, so the review catches narrow-screen clipping rather than silently skipping it.
          MINI_TYPE="$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; print(next((d["identifier"] for d in json.load(sys.stdin)["devicetypes"] if d["name"] == "iPhone 13 mini"), ""))')"
          IOS_RUNTIME="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next((r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS")), ""))')"
          if [[ -n "$MINI_TYPE" && -n "$IOS_RUNTIME" ]]; then
            CREATED_MINI="$(xcrun simctl create 'NOOP UI review iPhone 13 mini' "$MINI_TYPE" "$IOS_RUNTIME" 2>/dev/null || true)"
            if [[ -n "$CREATED_MINI" ]] && xcrun simctl boot "$CREATED_MINI" >/dev/null 2>&1; then
              UDID="$CREATED_MINI"
            fi
          fi
          echo "UI review simulator: $UDID"
          BUILT_PRODUCTS_DIR="$(xcodebuild \
            -project Strand.xcodeproj \
            -scheme NOOPiOS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -showBuildSettings \
            CODE_SIGNING_ALLOWED=NO 2>/dev/null | awk -F ' = ' '/^[[:space:]]*BUILT_PRODUCTS_DIR = / { print $2; exit }')"
          APP="$BUILT_PRODUCTS_DIR/NOOP.app"
          test -d "$APP"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          xcrun simctl boot "$UDID" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time '9:41' --batteryState charged --batteryLevel 100 --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4
          xcrun simctl install "$UDID" "$APP"
          for APPEARANCE in light dark; do
            xcrun simctl ui "$UDID" appearance "$APPEARANCE"
            for SCREEN in liquidtoday trends sleep workouts health settings; do
              xcrun simctl terminate "$UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
              # `--demo-seed` uses the app's DEBUG-only synthetic dataset; no values are presented as live data.
              xcrun simctl launch "$UDID" "$BUNDLE_ID" --demo-seed --demo-screen "$SCREEN"
              # The Sleep model decodes a full night and can take longer on cold light-mode launches.
              # Give that path 45s so the screenshot cannot capture a blank launch frame.
              if [[ "$SCREEN" == "sleep" && "$APPEARANCE" == "light" ]]; then
                sleep 45
              else
                sleep 18
              fi
              xcrun simctl io "$UDID" screenshot "$CAPTURE_DIR/$SCREEN-$APPEARANCE.png"
            done
          done

      - name: Upload seeded design review screenshots
        uses: actions/upload-artifact@v4
        with:
          name: noop-iphone-ui-review
          path: ${{ runner.temp }}/noop-ui-review/*.png
          if-no-files-found: error
          retention-days: 14
