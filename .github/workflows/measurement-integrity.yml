name: Measurement integrity candidate

on:
  push:
    branches: ['rebuild/ryanbr-noop12-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: measurement-integrity-${{ github.ref }}
  # Finish the running candidate so simulator screenshots and failures remain reviewable.
  # New pushes queue the latest candidate instead of discarding that evidence mid-test.
  cancel-in-progress: false

jobs:
  packages:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        package: [StrandImport, WhoopStore, StrandAnalytics, WhoopProtocol, StrandDesign]
    steps:
      - uses: actions/checkout@v5
      - name: Record exact candidate
        run: git rev-parse HEAD
      - name: Test package including import and persistence regressions
        working-directory: Packages/${{ matrix.package }}
        run: swift test

  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: NOOPiOS
            runner: macos-26
            destination: 'generic/platform=iOS Simulator'
          - scheme: Strand
            runner: macos-15
            destination: 'generic/platform=macOS'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Record exact candidate
        run: git rev-parse HEAD
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate app project
        run: xcodegen generate
      - name: Compile app including adapter and provenance labels
        run: >-
          xcodebuild -scheme '${{ matrix.scheme }}' -configuration Debug
          -destination '${{ matrix.destination }}'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Run shared app regressions
        if: matrix.scheme == 'Strand'
        run: >-
          xcodebuild -scheme Strand -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test

  interface:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Select an available iPhone simulator
        run: |
          xcrun simctl list devices available -j > /tmp/noop-simulators.json
          python3 - <<'PY'
          import json, os
          devices = json.load(open('/tmp/noop-simulators.json'))['devices']
          iphones = [d for group in devices.values() for d in group if d['name'].startswith('iPhone')]
          assert iphones, 'No available iPhone simulator'
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('NOOP_SIMULATOR_ID=' + iphones[0]['udid'] + '\n')
          PY
      - name: Exercise classic navigation using synthetic local fixtures
        run: >-
          xcodebuild -scheme NOOPiOS -configuration Debug
          -destination "platform=iOS Simulator,id=$NOOP_SIMULATOR_ID"
          -resultBundlePath UIResults.xcresult
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          -parallel-testing-enabled NO test
      - name: Export screenshot attachments for visual review
        if: always()
        run: |
          if [ -d UIResults.xcresult ]; then
            xcrun xcresulttool export attachments --path UIResults.xcresult --output-path UIAttachments
          fi
      - name: Save simulator test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classic-interface-results
          path: |
            UIResults.xcresult
            UIAttachments
          retention-days: 7

  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check source hygiene
        run: python3 Tools/doc_comment_lint.py
