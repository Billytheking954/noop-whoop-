name: One-time Sleep localization catalog update

on:
  push:
    branches:
      - feature/sleep-night-map-clinical-20261009
    paths:
      - '.github/workflows/sleep-catalog-bootstrap.yml'
      - 'Tools/sleep_i18n_patch_20261009.json'

permissions:
  contents: write

jobs:
  update-catalog:
    if: github.ref == 'refs/heads/feature/sleep-night-map-clinical-20261009'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply reviewed translations to original XCStrings catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("Strand/Resources/Localizable.xcstrings")
          patch_path = Path("Tools/sleep_i18n_patch_20261009.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          patch = json.loads(patch_path.read_text(encoding="utf-8"))
          assert patch["locales"] == ["de","es","fr","pt-PT"]
          count = 0
          for key, values in patch["strings"].items():
              assert len(values) == 4 and all(v for v in values)
              if key in data["strings"]:
                  continue
              data["strings"][key] = {
                  "localizations": {
                      locale: {"stringUnit": {"state": "translated", "value": value}}
                      for locale, value in zip(patch["locales"], values)
                  }
              }
              count += 1
          data["strings"] = dict(sorted(data["strings"].items()))
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("Added localized string keys:", count)
          PY
          python3 Tools/i18n_ios_ci.py
      - name: Commit catalog only to the Sleep feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Strand/Resources/Localizable.xcstrings
          if git diff --cached --quiet; then
            echo "No catalog changes"
          else
            git commit -m "Sleep: add translated Night Map strings to native catalog"
            git push origin HEAD:refs/heads/feature/sleep-night-map-clinical-20261009
          fi
