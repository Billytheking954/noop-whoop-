name: One-time preserve native XCStrings catalog formatting

on:
  push:
    branches: [feature/sleep-night-map-clinical-20261009]
    paths:
      - '.github/workflows/sleep-catalog-format-cleanup.yml'

permissions:
  contents: write

jobs:
  restore-format:
    if: github.ref == 'refs/heads/feature/sleep-night-map-clinical-20261009'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Preserve original catalog bytes and append only the new translated entries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          path = Path("Strand/Resources/Localizable.xcstrings")
          baseline = subprocess.check_output([
              "git", "show", "583225d25f6a815f405881d3de8b7ed354a05234:Strand/Resources/Localizable.xcstrings"
          ]).decode("utf-8")
          original = json.loads(baseline)
          updated = json.loads(path.read_text(encoding="utf-8"))
          assert original["sourceLanguage"] == updated["sourceLanguage"]
          assert original["version"] == updated["version"]
          for key, item in original["strings"].items():
              assert item == updated["strings"][key], "Existing translation must remain intact: " + key
          additions = {k:v for k,v in updated["strings"].items() if k not in original["strings"]}
          assert len(additions) == 39, f"Expected 39 new translations, got {len(additions)}"
          marker = '\n  },\n  "version"'
          assert baseline.count(marker) == 1
          before, after = baseline.split(marker)
          assert before.rstrip().endswith("}")
          def entry(key, value):
              serialized = json.dumps(value, ensure_ascii=True, indent=2)
              return '    ' + json.dumps(key, ensure_ascii=True) + ': ' + serialized.replace('\n','\n    ')
          merged = before.rstrip() + ',\n' + ',\n'.join(entry(k,v) for k,v in sorted(additions.items())) + marker + after
          assert json.loads(merged)["strings"] == updated["strings"], "Semantic parity failed"
          path.write_text(merged, encoding="utf-8")
          print("Catalog: preserved original bytes, appended",len(additions),"new translations")
          PY
          python3 Tools/i18n_ios_ci.py
      - name: Commit byte-preserving catalog fix on feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Strand/Resources/Localizable.xcstrings
          git commit -m "Sleep: minimize localization diff without changing translations"
          git push origin HEAD:refs/heads/feature/sleep-night-map-clinical-20261009
