name: Source Hygiene

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: source-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: iPhone-only repository invariants
        run: python3 Tools/verify_iphone_only_repo.py

      - name: Detached Swift doc comments (regression gate)
        run: python3 Tools/doc_comment_lint.py

      - name: Protocol doc examples (arithmetic check)
        run: python3 docs/protocol-examples/validate_examples.py
