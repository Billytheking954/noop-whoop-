name: Recover exact NOOP 12 V2 tree (macOS)

on:
  push:
    branches:
      - integration/noop12-v2

permissions:
  contents: write

concurrency:
  group: noop12-v2-bundle-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: ${{ github.ref == 'refs/heads/integration/noop12-v2' }}
    runs-on: macos-26
    steps:
      - name: Checkout recovery bootstrap
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct exact verified bundle tree
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/recovery/manifest.json
          python3 - <<'PY'
          import json
          m=json.load(open('.github/recovery/manifest.json'))
          assert m['target_tree']=='238fa6c4598921477ef66f4f178d0aa19ca96324'
          assert m['bundle_head']=='8be6eac83dafaac7321d8d1d3505e0e80d4531b1'
          assert m['upstream_baseline']=='7acce06c3d22cb5dfe959f2c4a43902471d21332'
          PY

          cat .github/recovery/payload/patch.*.b64 | base64 --decode > /tmp/missing44.patch.gz
          echo '50908bd0d024453908dc89539985832211166b69e0368b9b8e9c76cecee021cc  /tmp/missing44.patch.gz' | sha256sum -c -
          gzip -dc /tmp/missing44.patch.gz > /tmp/missing44.patch
          git apply --index --whitespace=nowarn /tmp/missing44.patch

          cat .github/recovery/payload/locv2.*.b64 | base64 --decode > /tmp/localizable-delta.json.gz
          echo '0bfada9d01298ac52c1f18deedb656f701a57469c40a0d5cbdaa8322dee60099  /tmp/localizable-delta.json.gz' | sha256sum -c -
          gzip -dc /tmp/localizable-delta.json.gz > /tmp/localizable-delta.json
          git show 7acce06c3d22cb5dfe959f2c4a43902471d21332:Strand/Resources/Localizable.xcstrings > /tmp/localizable-base.xcstrings

          python3 - <<'PY'
          import json, pathlib
          base=json.load(open('/tmp/localizable-base.xcstrings',encoding='utf-8'))
          delta=json.load(open('/tmp/localizable-delta.json',encoding='utf-8'))
          old=base['strings']
          changed=delta['changed']
          rebuilt={}
          for key in delta['order']:
              rebuilt[key]=changed[key] if key in changed else old[key]
          out={'sourceLanguage':'en','strings':rebuilt,'version':'1.0'}
          pathlib.Path('Strand/Resources/Localizable.xcstrings').write_text(
              json.dumps(out,indent=2,ensure_ascii=False)+'\n',encoding='utf-8'
          )
          PY
          test "$(git hash-object Strand/Resources/Localizable.xcstrings)" = '292fdfc4948689e2228ea9ee421a730f1de9fb22'
          git add Strand/Resources/Localizable.xcstrings

          python3 - <<'PY'
          import json, subprocess, sys
          m=json.load(open('.github/recovery/manifest.json'))
          bad=[]
          for path,expected in m['expected_blobs'].items():
              got=subprocess.check_output(['git','hash-object',path],text=True).strip()
              if got != expected:
                  bad.append((path,expected,got))
          if bad:
              for row in bad: print('blob mismatch:',*row,file=sys.stderr)
              raise SystemExit(1)
          print(f"verified {len(m['expected_blobs'])} reconstructed local-only blobs")
          PY

          git rm -r .github/recovery .github/workflows/noop12-bundle-recovery.yml .github/workflows/noop12-bundle-recovery-macos.yml
          TREE="$(git write-tree)"
          echo "reconstructed tree: $TREE"
          test "$TREE" = '238fa6c4598921477ef66f4f178d0aa19ca96324'

          git config user.name 'NOOP Recovery Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'recovery: restore exact verified NOOP 12 V2 tree'
          test "$(git show -s --format=%T HEAD)" = '238fa6c4598921477ef66f4f178d0aa19ca96324'
          git push origin HEAD:refs/heads/integration/noop12-v2
