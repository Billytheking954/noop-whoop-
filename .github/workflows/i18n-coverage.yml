name: iPhone i18n Coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: i18n-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: iPhone localisation audit
        run: python3 Tools/i18n_audit.py --platform ios --ci origin/${{ github.base_ref || 'main' }}
