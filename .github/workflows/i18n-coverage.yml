# Temporary integration-only workflow used to materialize the combined NOOP 11.8 + Night Lab
# i18n baseline. This file is restored to the upstream workflow after the generated baseline is
# committed to the integration branch.
name: i18n Coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: i18n-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate combined-tree i18n baseline for integration
        run: python3 Tools/i18n_audit.py --update-baseline

      - name: Upload generated i18n baseline
        uses: actions/upload-artifact@v4
        with:
          name: noop-11.8-i18n-baseline
          path: Tools/i18n_audit_baseline.json
          if-no-files-found: error

      - name: i18n audit (regression gate)
        run: python3 Tools/i18n_audit.py --ci origin/${{ github.base_ref || 'main' }}
