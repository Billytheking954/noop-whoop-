# Temporary integration-only workflow used to materialize the combined NOOP 11.8 + Night Lab
# i18n baseline. This file is restored to the upstream workflow after the generated baseline is
# committed to the integration branch.
name: i18n Coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: i18n-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Generate combined-tree i18n baseline for integration
        run: python3 Tools/i18n_audit.py --update-baseline

      - name: Commit generated baseline to integration branch
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- Tools/i18n_audit_baseline.json; then
            echo 'Baseline already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Tools/i18n_audit_baseline.json
          git commit -m 'Update i18n baseline for NOOP 11.8 Night Lab integration'
          git push origin HEAD:${{ github.head_ref }}

      - name: i18n audit (regression gate)
        run: python3 Tools/i18n_audit.py --ci origin/${{ github.base_ref || 'main' }}
