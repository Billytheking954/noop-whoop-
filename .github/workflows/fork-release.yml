# Deprecated final-release path.
#
# The old version of this workflow published Android, macOS and an unsigned iOS
# payload and created the GitHub release before provenance/signing verification.
# That is incompatible with the fork's final-release contract.  Its history
# remains in git; keeping this fail-closed stub prevents an accidental manual
# dispatch from resurrecting that publishing behaviour.
name: DEPRECATED — legacy fork release (blocked)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Stop legacy release path
        run: |
          echo "::error::This legacy multi-platform/unsigned release workflow is retired."
          echo "Use: Final iPhone release — provenance locked"
          echo "The final fork release must be a freshly built, signed, verified iPhone IPA tied to one exact Git SHA."
          exit 1
