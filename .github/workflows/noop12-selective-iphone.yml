name: NOOP12 selective rebuild and unsigned iPhone IPA
on:
  push:
    branches:
      - 'rebuild/ryanbr-noop12-selective-*'
  workflow_dispatch:

permissions:
  contents: read

env:
  NOOP_UPSTREAM_V12_SHA: '7acce06c3d22cb5dfe959f2c4a43902471d21332'
  NOOP_STAGING_BUNDLE_PREFIX: com.noopapp.rebuild

# Only the newest source SHA needs a build. Older queued candidates must not
# consume macOS runners or produce an IPA that appears to be the final revision.
concurrency:
  group: noop12-selective-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python tools and repository acceptance
        run: |
          python3 -m unittest discover -s Tools -p 'test_*.py'
          (cd Tools/linux-capture && python3 -m unittest discover -p 'test_*.py')
      - name: Localization regression gate
        env:
          NOOP_PUSH_BEFORE: ${{ github.event.before }}
        run: python3 Tools/i18n_audit.py --ci "${NOOP_PUSH_BEFORE:-HEAD~1}"

  source-and-packages:
    runs-on: macos-15-intel
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Source hygiene and Swift package suites
        env:
          NOOP_PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 Tools/doc_comment_lint.py
          BASE="$NOOP_PUSH_BEFORE"
          if [[ -z "$BASE" || "$BASE" == 0000000000000000000000000000000000000000 ]]; then
            BASE="$NOOP_UPSTREAM_V12_SHA"
          elif ! git cat-file -e "$BASE^{commit}"; then
            git fetch --no-tags origin "$BASE"
          fi
          git diff --check "$BASE" "$GITHUB_SHA"
          FAILED=0
          for manifest in Packages/*/Package.swift; do
            PACKAGE="${manifest%/Package.swift}"
            echo "::group::Testing $PACKAGE"
            ( cd "$PACKAGE" && swift test ) || FAILED=1
            echo "::endgroup::"
          done
          exit "$FAILED"
      - name: Build shared Swift tools and run their supported tests
        run: |
          set -euo pipefail
          for TOOL in SleepBench SleepPSG Backfill; do
            ( cd "Tools/$TOOL" && swift build && if grep -q testTarget Package.swift; then swift test; fi )
          done

  macos:
    runs-on: macos-15-intel
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build and test reference macOS app
        run: |
          xcodebuild -scheme Strand -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test

  iphone-simulator:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Select an available iPhone simulator
        run: |
          xcrun simctl list devices available -j > /tmp/noop-phones.json
          python3 - <<'PY'
          import json, os
          devices = json.load(open('/tmp/noop-phones.json'))['devices']
          phones = [d for group in devices.values() for d in group if d['name'].startswith('iPhone')]
          assert phones, 'No iPhone simulator'
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('NOOP_SIMULATOR_ID=' + phones[0]['udid'] + '\n')
          PY
      - name: Build iPhone simulator app
        run: |
          xcodebuild -scheme NOOPiOS -configuration Debug \
            -destination "platform=iOS Simulator,id=$NOOP_SIMULATOR_ID" \
            -derivedDataPath build/ios-simulator \
            BUNDLE_ID_PREFIX="$NOOP_STAGING_BUNDLE_PREFIX" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Run iPhone safety regression tests
        run: |
          set -euo pipefail
          xcodebuild -scheme NOOPiOS -configuration Debug \
            -destination "platform=iOS Simulator,id=$NOOP_SIMULATOR_ID" \
            -derivedDataPath build/ios-simulator \
            -resultBundlePath build/ios-safety.xcresult \
            BUNDLE_ID_PREFIX="$NOOP_STAGING_BUNDLE_PREFIX" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test
      - name: Save iPhone test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noop12-iphone-safety-tests
          path: build/ios-safety.xcresult
          if-no-files-found: warn
          retention-days: 14
      - name: Install, launch and capture native iPhone screen
        run: |
          set -euo pipefail
          xcrun simctl boot "$NOOP_SIMULATOR_ID" || true
          xcrun simctl bootstatus "$NOOP_SIMULATOR_ID" -b
          APP=$(find build/ios-simulator/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP"
          ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl install "$NOOP_SIMULATOR_ID" "$APP"
          xcrun simctl launch "$NOOP_SIMULATOR_ID" "$ID"
          mkdir -p iPhoneScreenshots
          sleep 5
          xcrun simctl io "$NOOP_SIMULATOR_ID" screenshot iPhoneScreenshots/launch.png
      - name: Save simulator launch screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noop12-selective-iphone-smoke-evidence
          path: iPhoneScreenshots
          if-no-files-found: warn
          retention-days: 14

  unsigned-iphone-ipa:
    needs: [source-and-packages, macos, iphone-simulator, tools]
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build unsigned iPhone Release device app with safe staging ID
        run: |
          set -euo pipefail
          mkdir -p build
          BUILD_SETTINGS=(
            -scheme NOOPiOS -configuration Release
            -destination 'generic/platform=iOS'
            -derivedDataPath build/dd
            "BUNDLE_ID_PREFIX=$NOOP_STAGING_BUNDLE_PREFIX"
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=
          )
          xcodebuild "${BUILD_SETTINGS[@]}" build
          xcodebuild "${BUILD_SETTINGS[@]}" -showBuildSettings -json > build/ios-release-settings.json
      - name: Inspect, prepare and package IPA
        run: |
          set -euo pipefail
          APP=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP"
          test -d "$APP/PlugIns/NOOPWidgets.appex"
          rm -rf "$APP/Watch"
          python3 - "$APP" <<'PY'
          import json, os, pathlib, plistlib, subprocess, sys
          app = pathlib.Path(sys.argv[1])
          info = plistlib.loads((app/'Info.plist').read_bytes())
          widget = plistlib.loads((app/'PlugIns/NOOPWidgets.appex/Info.plist').read_bytes())
          settings = json.loads(pathlib.Path('build/ios-release-settings.json').read_text())
          app_settings, = (item['buildSettings'] for item in settings if item['target'] == 'NOOPiOS')
          assert info['CFBundleShortVersionString'] == widget['CFBundleShortVersionString'] == app_settings['MARKETING_VERSION']
          assert info['CFBundleVersion'] == widget['CFBundleVersion'] == app_settings['CURRENT_PROJECT_VERSION']
          assert info['AppGroupIdentifier'] == widget['AppGroupIdentifier'] == app_settings['APP_GROUP_ID']
          assert info['CFBundleIdentifier'] == os.environ['NOOP_STAGING_BUNDLE_PREFIX'] + '.noop'
          assert widget['CFBundleIdentifier'] == info['CFBundleIdentifier'] + '.widgets'
          assert 1 in info['UIDeviceFamily'], 'iPhone device family missing'
          def tool_version(*args):
              return subprocess.check_output(args, text=True).strip()

          toolchain = {
              'runner_image':os.environ.get('ImageVersion'),
              'macos':tool_version('sw_vers', '-productVersion'),
              'xcode':tool_version('xcodebuild', '-version'),
              'ios_sdk':tool_version('xcrun', '--sdk', 'iphoneos', '--show-sdk-version'),
              'xcodegen':tool_version('xcodegen', '--version')
          }
          print('Apple toolchain:', json.dumps(toolchain, sort_keys=True))
          (app/'NOOPBuildProvenance.json').write_text(json.dumps({
              'repository':os.environ['GITHUB_REPOSITORY'],
              'source_sha':os.environ['GITHUB_SHA'],
              'upstream_v12_sha':os.environ['NOOP_UPSTREAM_V12_SHA'],
              'marketing_version':info['CFBundleShortVersionString'],
              'build_number':info['CFBundleVersion'],
              'toolchain':toolchain,
              'edition':'Ryanbr 12 selective health test candidate',
              'staging_identity':True,
              'spo2_summary_decoder':'unverified research; NOT production scoring',
              'physical_device_validated':False
          }, sort_keys=True, indent=2)+'\n')
          PY
          bash Tools/prepare-ios-sideload-app.sh "$APP"
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          lipo -archs "$APP/$EXEC" | grep -qw arm64
          mkdir -p release-out Payload
          # Xcode PRODUCT_NAME is "NOOP Staging", not "NOOP"; normalise the
          # archive directory without changing the bundle identifier.
          cp -R "$APP" "Payload/NOOP.app"
          SHORT=$(printf '%s' "$GITHUB_SHA" | cut -c 1-12)
          IPA="NOOP-Ryanbr12-selective-$SHORT-unsigned.ipa"
          zip -qry "release-out/$IPA" Payload
          python3 - "$IPA" <<'PY'
          import hashlib, json, os, pathlib, plistlib, sys, zipfile
          name=sys.argv[1]
          file=pathlib.Path('release-out')/name
          with zipfile.ZipFile(file) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert len(names)==len(set(names)), 'duplicate ZIP member name'
              root='Payload/NOOP.app/'
              app=plistlib.loads(z.read(root+'Info.plist'))
              widgetRoot=root+'PlugIns/NOOPWidgets.appex/'
              widget=plistlib.loads(z.read(widgetRoot+'Info.plist'))
              provenance=json.loads(z.read(root+'NOOPBuildProvenance.json'))
              assert provenance['source_sha']==os.environ['GITHUB_SHA']
              assert provenance['upstream_v12_sha']==os.environ['NOOP_UPSTREAM_V12_SHA']
              assert root+app['CFBundleExecutable'] in names
              assert widgetRoot+widget['CFBundleExecutable'] in names
              assert app['AppGroupIdentifier']==widget['AppGroupIdentifier']
              assert app['CFBundleVersion']==widget['CFBundleVersion']
              assert not any('/Watch/' in n for n in names)
              assert any(n.startswith(root+'_CodeSignature/') for n in names)
              assert any(n.startswith(widgetRoot+'_CodeSignature/') for n in names)
          digest=hashlib.sha256(file.read_bytes()).hexdigest()
          (file.parent/(name+'.sha256.txt')).write_text(digest+'  '+name+'\n')
          (file.parent/'manifest.json').write_text(json.dumps({
              'filename':name,'sha256':digest,
              'source_sha':provenance['source_sha'],
              'upstream_v12_sha':provenance['upstream_v12_sha'],
              'marketing_version':provenance['marketing_version'],
              'build_number':provenance['build_number'],
              'toolchain':provenance['toolchain'],
              'unsigned':True,'requires_sideload_resigning':True,
              'safe_for_in_place_data_migration':False,
              'physical_device_validated':False
          },sort_keys=True,indent=2)+'\n')
          print('Verified IPA:',name,'SHA256:',digest)
          PY
      - name: Upload unsigned IPA and manifest
        uses: actions/upload-artifact@v4
        with:
          name: noop12-selective-unsigned-iphone
          path: release-out/*
          if-no-files-found: error
          retention-days: 90
