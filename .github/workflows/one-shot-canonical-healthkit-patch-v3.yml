name: One-shot canonical HealthKit patch v3

on:
  push:
    branches: [feat/canonical-workout-fit-20260927]
    paths:
      - '.github/workflows/one-shot-canonical-healthkit-patch-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/canonical-workout-fit-20260927
          fetch-depth: 0
      - name: Patch exact bridge blocks
        run: python3 .github/scripts/patch_canonical_healthkit.py
      - name: Verify bridge-only diff
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only)" = "StrandiOS/Health/HealthKitBridge.swift"
          git diff -- StrandiOS/Health/HealthKitBridge.swift
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add StrandiOS/Health/HealthKitBridge.swift
          git commit -m "Route HealthKit workouts through canonical model and retire legacy data safely"
          git push origin HEAD:feat/canonical-workout-fit-20260927
