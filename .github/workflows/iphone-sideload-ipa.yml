name: Unsigned iPhone sideload IPA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/iphone-sideload-ipa.yml'
      - '.github/workflows/app-build.yml'
      - '.github/release/iphone-v2-final.json'
      - 'Tools/prepare_iphone_sideload.sh'
      - 'project.yml'
      - 'Config/**'
      - 'Packages/**'
      - 'Strand/**'
      - 'StrandiOS/**'
      - 'StrandiOSShared/**'
      - 'StrandiOSWidgets/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/iphone-sideload-ipa.yml'
      - '.github/workflows/app-build.yml'
      - '.github/release/iphone-v2-final.json'
      - 'Tools/prepare_iphone_sideload.sh'
      - 'project.yml'
      - 'Config/**'
      - 'Packages/**'
      - 'Strand/**'
      - 'StrandiOS/**'
      - 'StrandiOSShared/**'
      - 'StrandiOSWidgets/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # PR artifacts must come from the named branch's final commit, not GitHub's
          # temporary test-merge ref. The embedded source SHA then resolves to that branch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check source and scope
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor 7acce06c3d22cb5dfe959f2c4a43902471d21332 HEAD
          python3 Tools/verify_iphone_only_repo.py
          python3 - <<'PY'
          import json
          p = json.load(open('.github/release/iphone-v2-final.json'))
          assert (p['version'], p['build'], p['device_family']) == ('12.0.0', 435, 'iPhone')
          assert p['included_prs'] == sorted(set(p['included_prs']))
          assert p['remaining_open_prs'] == sorted(set(p['remaining_open_prs']))
          assert p['spo2']['production_scoring'] is False
          PY
      - name: Archive fresh physical-iPhone app
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Strand.xcodeproj -scheme NOOPiOS -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/sideload/NOOPiOS.xcarchive" \
            -derivedDataPath "$PWD/build/sideload/DerivedData" \
            CODE_SIGNING_ALLOWED=NO BUNDLE_ID_PREFIX=com.noopapp archive
      - name: Package and verify sideload IPA
        id: ipa
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          SHORT="${SHA:0:12}"
          ARCHIVE="$PWD/build/sideload/NOOPiOS.xcarchive"
          test -d "$ARCHIVE"
          APP="$ARCHIVE/Products/Applications/NOOP.app"
          test -d "$APP/PlugIns/NOOPWidgets.appex"
          test ! -d "$APP/Watch"
          test "$(find "$APP/PlugIns" -maxdepth 1 -name '*.appex' -type d | wc -l | tr -d ' ')" = 1
          ARCHS="$(lipo -archs "$APP/NOOP")"
          grep -qw arm64 <<< "$ARCHS"
          ! grep -Eq 'x86_64|i386' <<< "$ARCHS"
          python3 - "$APP" "$SHA" <<'PY'
          import json, pathlib, plistlib, sys
          app, sha = pathlib.Path(sys.argv[1]), sys.argv[2]
          scope = json.loads(pathlib.Path('.github/release/iphone-v2-final.json').read_text())
          with (app/'Info.plist').open('rb') as f: info = plistlib.load(f)
          with (app/'PlugIns/NOOPWidgets.appex/Info.plist').open('rb') as f: widget = plistlib.load(f)
          assert info['CFBundleIdentifier'] == 'com.noopapp.noop'
          assert widget['CFBundleIdentifier'] == 'com.noopapp.noop.widgets'
          assert info['UIDeviceFamily'] == widget['UIDeviceFamily'] == [1]
          assert info['CFBundleShortVersionString'] == widget['CFBundleShortVersionString'] == '12.0.0'
          assert info['CFBundleVersion'] == widget['CFBundleVersion'] == '435'
          assert info['AppGroupIdentifier'] == widget['AppGroupIdentifier']
          info.update(NOOPReleaseGitSHA=sha, NOOPReleaseBaseline='NOOP 12.0.0', NOOPReleaseFamily='NOOP V2')
          with (app/'Info.plist').open('wb') as f: plistlib.dump(info, f)
          (app/'NOOPReleaseProvenance.json').write_text(json.dumps({
            'repository':'Billytheking954/noop-whoop-', 'branch':__import__('os').environ.get('GITHUB_HEAD_REF') or __import__('os').environ['GITHUB_REF_NAME'],
            'git_sha':sha, 'upstream_baseline':'NOOP 12.0.0', 'upstream_baseline_sha':'7acce06c3d22cb5dfe959f2c4a43902471d21332',
            'product':'NOOP', 'release_family':'NOOP V2', 'app_version':'12.0.0', 'build_number':'435',
            'platform':'iOS', 'device_family':'iPhone', 'architecture':'arm64', 'build_action':'archive',
            'signing':'ad-hoc; sideloader must re-sign',
            'included_prs':scope['included_prs'],
            'remaining_open_prs':scope['remaining_open_prs'],
            'experimental_spo2_production_scoring':False,
          }, indent=2, sort_keys=True)+'\n')
          PY
          bash Tools/prepare_iphone_sideload.sh "$APP"
          NAME="NOOP-V2-12.0-base-${SHORT}-iphone-unsigned.ipa"
          mkdir -p release-out Payload
          ditto "$APP" "$PWD/Payload/NOOP.app"
          ditto -c -k --sequesterRsrc --keepParent "$PWD/Payload" "$PWD/release-out/$NAME"
          IPA_NAME="$NAME" SOURCE_SHA="$SHA" python3 - <<'PY'
          import json, os, plistlib, zipfile
          name, sha = os.environ['IPA_NAME'], os.environ['SOURCE_SHA']
          with zipfile.ZipFile('release-out/'+name) as z:
            assert z.testzip() is None
            entries = z.namelist()
            assert len([n for n in entries if n.endswith('.app/Info.plist') and n.count('/') == 2]) == 1
            info = plistlib.loads(z.read('Payload/NOOP.app/Info.plist'))
            prov = json.loads(z.read('Payload/NOOP.app/NOOPReleaseProvenance.json'))
            assert info['NOOPReleaseGitSHA'] == prov['git_sha'] == sha
            assert info['CFBundleIdentifier'] == 'com.noopapp.noop' and info['UIDeviceFamily'] == [1]
            assert any(n.startswith('Payload/NOOP.app/_CodeSignature/') for n in entries)
            assert any(n.startswith('Payload/NOOP.app/PlugIns/NOOPWidgets.appex/_CodeSignature/') for n in entries)
            assert not any('/Watch/' in n or '/MacOS/' in n for n in entries)
          PY
          IPA_SHA="$(shasum -a 256 "release-out/$NAME" | awk '{print $1}')"
          printf '%s  %s\n' "$IPA_SHA" "$NAME" > "release-out/$NAME.sha256.txt"
          python3 - "$NAME" "$SHA" <<'PY'
          import hashlib, json, os, pathlib, sys
          name, sha = sys.argv[1:]
          ipa = pathlib.Path('release-out')/name
          (ipa.parent/'sideload-manifest.json').write_text(json.dumps({
            'source_sha':sha, 'branch':os.environ.get('GITHUB_HEAD_REF') or os.environ['GITHUB_REF_NAME'],
            'artifact':name, 'sha256':hashlib.sha256(ipa.read_bytes()).hexdigest(),
            'version':'12.0.0', 'build':'435', 'platform':'iPhone', 'build_action':'archive',
            'signing':'ad-hoc capability template; AltStore/SideStore must re-sign',
          }, indent=2, sort_keys=True)+'\n')
          PY
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: noop-v2-iphone-sideload-${{ steps.ipa.outputs.sha }}
          path: release-out/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish clearly labelled unsigned sideload build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA="${{ steps.ipa.outputs.sha }}"
          test "$SHA" = "$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          TAG="noop-v2-iphone-sideload-${SHA:0:12}"
          ! gh release view "$TAG" >/dev/null 2>&1
          gh release create "$TAG" release-out/* --target "$SHA" \
            --title "NOOP V2 iPhone 12.0.0 (unsigned sideload IPA)" \
            --notes "Built fresh from main commit $SHA. iPhone arm64 only. This IPA carries ad-hoc capability templates and must be re-signed by AltStore or SideStore before installation. It is distinct from the signed final-release workflow. Experimental SpO2 is instrumentation only."
